name: Feature request
description: Suggest an idea for Sidetone
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation in the sim and what would make it better.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How might it work?
